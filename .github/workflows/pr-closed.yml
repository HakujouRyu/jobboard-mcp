# Deletes a PR's Actions caches when it closes, merged or not. GitHub's "Automatically delete
# head branches" setting removes the branch.
#
# pull_request_target so the token can delete caches for PRs from forks too. That's safe here
# because nothing checks out or runs the PR's code.
name: PR closed

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  delete-caches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete caches for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          ids=$(gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id')
          if [ -z "$ids" ]; then
            echo "No caches for $REF."
            exit 0
          fi
          for id in $ids; do
            gh cache delete "$id"
          done
