# Housekeeping when a PR closes: live tests against the merged code, then cache cleanup. GitHub's
# "Automatically delete head branches" setting removes the branch.
#
# pull_request_target so the token can delete caches for PRs from forks too. That's
# safe here because nothing runs the PR's code: the live tests check out the merge commit, which
# is already on the base branch.
name: PR closed

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  live-tests:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install
        run: uv sync --locked

      # A failure can mean a board changed rather than a bug. See "Checks" in CONTRIBUTING.md.
      - name: Live tests
        run: uv run pytest -m live

  delete-caches:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete caches for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          ids=$(gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id')
          if [ -z "$ids" ]; then
            echo "No caches for $REF."
            exit 0
          fi
          for id in $ids; do
            gh cache delete "$id"
          done
