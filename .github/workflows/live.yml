# Live tests against the real board APIs: after every merge, and weekly, because boards change
# without any commit here. A failure on main opens an issue (or comments on the open one), and the
# next passing run closes it. A failure can mean a board changed rather than a bug. See "Checks"
# in CONTRIBUTING.md.
name: Live tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC, off the hour when GitHub's scheduler is busiest
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: false

env:
  LABEL: live-tests

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install
        run: uv sync --locked

      - name: Live tests
        run: uv run pytest -m live

  report-failure:
    needs: live
    if: always() && needs.live.result == 'failure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          gh label create "$LABEL" --color D93F0B \
            --description "Live tests against the real board APIs are failing" --force
          body="Live tests failed on \`$SHA\` ($EVENT): $RUN_URL

          A board may have changed rather than the code. Check which test failed before changing code."
          number=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Live tests failing" --label "$LABEL" --body "$body"
          fi

  report-recovery:
    needs: live
    if: needs.live.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Live tests pass again: $RUN_URL"
          fi
