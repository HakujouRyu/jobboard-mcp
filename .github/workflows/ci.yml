# The three checks CONTRIBUTING.md requires before a merge, on every PR and on main. Live tests
# run separately (live.yml), since a real board changing shouldn't block a PR.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main all finish, so each merge gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, format, and types give the same answer everywhere, so they run once.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

  # The oldest supported Python and the newest, on every OS.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --locked

      - name: Tests (offline)
        run: uv run pytest

  # Workflow security audit. Pre-commit runs the same check offline; this run also does the
  # online audits. Findings print as annotations and fail the job.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1 # keep in step with .pre-commit-config.yaml
          advanced-security: false
          annotations: true

  # The one status check the main ruleset requires, so adding a matrix entry doesn't mean
  # editing the ruleset. It fails if any job above failed or was cancelled.
  checks:
    if: always()
    needs: [lint, test, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
