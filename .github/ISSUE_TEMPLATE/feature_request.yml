name: Feature request
description: A new tool, filter, ATS, or other improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The server only reads structured data: documented APIs first, then a careers site's own
        JSON, then schema.org JSON-LD. Requests to scrape LinkedIn, Indeed, or job content from
        page layout are out of scope (see "Ground rules" in CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then any solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: For a new ATS, link one or two public boards that use it.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to open the PR?
      options: ["Yes", "Maybe, with some pointers", "No"]
