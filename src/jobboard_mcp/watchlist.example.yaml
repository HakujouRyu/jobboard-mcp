# Example watchlist. On first run the server copies this file to your per-user watchlist
# (%APPDATA%\jobboard-mcp\watchlist.yaml on Windows, ~/.config/jobboard-mcp/watchlist.yaml
# elsewhere) and reads and edits that copy from then on. Edit your copy freely; see
# docs/watchlist.md for the format.
#
# Most of these come from hiring-without-whiteboards
# (https://github.com/poteto/hiring-without-whiteboards), a list of companies that interview with
# real-world work instead of whiteboard puzzles. Interview notes are paraphrased from that list
# and may be out of date. Tag `hww` = no-whiteboard interviews.
#
# ats: greenhouse | ashby | lever | null.  token: board token, or null if unknown.
# Entries with no board (careers page only) are skipped by sweeps (status no_board) until
# resolve_board finds one and update_company records it. add_company appends to the end.

- company: GitLab
  ats: greenhouse
  token: gitlab
  careers_url: https://about.gitlab.com/jobs/
  domains: [dev tools, open source]
  tags: [hww]
  interview_note: Video calls plus a coding exercise on a realistic merge request
  notes: Remote US

